<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img" aria-labelledby="title description">
  <title id="title">Kora travels with a delivery rider</title>
  <desc id="description">A dark violet illustration of a scooter rider following a delivery route while the Kora voice orb travels beside them.</desc>
  <defs>
    <clipPath id="canvas">
      <rect width="1440" height="600" rx="42"/>
    </clipPath>
  </defs>
