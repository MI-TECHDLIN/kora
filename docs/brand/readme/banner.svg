    <g transform="translate(958 170)">
      <circle cx="126" cy="72" r="38" fill="#C4B5FD"/>
      <path d="M103 113c36-22 87-8 107 28l49 90-69 17-42-71-35 60-51-25z" fill="#8B5CF6"/>
