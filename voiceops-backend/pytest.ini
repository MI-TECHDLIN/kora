[pytest]
testpaths = tests
asyncio_mode = strict
# -rs prints the reason for every skip, so opt-in tests are never silently absent.
addopts = -rs
markers =
    live: needs a running backend or a real third-party service; skipped unless --run-live or VOICEOPS_RUN_LIVE=1
    audio: needs a working sound device (sounddevice and PortAudio); skipped when there is none
    credentials(*settings): needs real credentials; args name the app.config settings that must be non-empty
