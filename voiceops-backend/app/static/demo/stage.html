<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07060B">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Kora – demo stage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238B5CF6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="customer.css">
  <link rel="stylesheet" href="stage.css">
</head>
<body class="stage" data-stage="connecting">
<div class="backdrop" aria-hidden="true"></div>

<main class="stage__grid">
  <section class="stage__left" aria-label="Join the call">
    <p class="eyebrow">Kora customer call</p>
    <h1 class="stage__title" id="title">Scan to take Kora’s call</h1>
    <figure class="qr" id="qrCard">
      <svg id="qr" viewBox="0 0 41 41" role="img" aria-label="QR code that opens the customer page" shape-rendering="crispEdges"><path id="qrPath" fill="#07060b"/></svg>
      <figcaption><span class="qr__label">Demo code</span> <strong id="codeText">–</strong></figcaption>
    </figure>
    <p class="stage__link" id="linkText"></p>
    <details class="stage__setup" id="setup">
      <summary>Setup</summary>
      <form id="setupForm" class="stage__form">
        <label>Demo code<input id="codeInput" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
        <label>Customer page address (what phones can reach)<input id="baseInput" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://your-app.example.com/demo"></label>
        <button class="btn btn--primary" type="submit">Apply</button>
      </form>
    </details>
  </section>

  <section class="stage__right" aria-label="Live call">
    <div class="stage__top">
      <p class="pill" id="statePill" data-state="ok"><span class="pill__dot"></span><span id="stateText">Connecting</span></p>
      <p class="stage__timer" id="timer" hidden>0:00</p>
    </div>
    <div class="stage__orb"><canvas id="orb" aria-hidden="true"></canvas></div>
    <div class="stage__captions" id="captions" role="log" aria-live="polite" aria-label="Live captions"></div>
    <div class="stage__summary" id="summary" hidden>
      <p class="chip" id="endChip">Call complete</p>
      <h2 id="sumHead"></h2>
      <ul class="points" id="sumPoints"></ul>
    </div>
  </section>
</main>
<script type="module" src="stage.js"></script>
</body>
</html>
